
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Product Management System</title>

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- NAVBAR -->

  <nav>

    <h1>Product <span>Management System</span></h1>

    <div class="search-box">

      <input
      type="text"
      id="search"
      placeholder="Search products">

      <i class="fa-solid fa-magnifying-glass"></i>

    </div>

  </nav>

  <!-- MAIN -->

  <div class="container">

    <!-- FORM -->

    <div class="form-box">

      <h2>Add Product</h2>

      <input type="text"
      id="name"
      placeholder="Product Name">

      <input type="number"
      id="price"
      placeholder="Product Price">

      <select id="category">

        <option>Electronics</option>
        <option>Fashion</option>
        <option>Shoes</option>
        <option>Gaming</option>

      </select>

      <textarea
      id="description"
      placeholder="Description"></textarea>

      <!-- IMAGE -->

      <label class="upload-box">

        <img id="preview"
        class="preview-image">

        <i
        class="fa-solid fa-cloud-arrow-up"
        id="uploadIcon"></i>

        <p id="uploadText">
          Upload Multiple Images
        </p>

        <input
        type="file"
        id="image"
        multiple
        accept="image/*"
        hidden>

      </label>

      <button
      class="add-btn"
      onclick="addProduct()">
      Add Product
      </button>

    </div>

    <!-- PRODUCTS -->

    <div class="products"
    id="products"></div>

  </div>

  <!-- DELETE ALERT -->

  <div class="alert-box"
  id="alertBox">

    <i class="fa-solid fa-trash"></i>

    <h2>Delete Product?</h2>

    <p>Are you sure you want to delete this product?</p>

    <div class="alert-buttons">

      <button
      class="cancel-btn"
      onclick="closeAlert()">
      Cancel
      </button>

      <button
      class="confirm-btn"
      id="confirmDelete">
      Delete
      </button>

    </div>

  </div>

  <!-- EDIT MODAL -->

  <div class="edit-modal"
  id="editModal">

    <div class="edit-box">

      <h2>Edit Product</h2>

      <input type="text"
      id="editName">

      <input type="number"
      id="editPrice">

      <textarea
      id="editDescription"></textarea>

      <button
      class="save-btn"
      onclick="saveEdit()">
      Save Changes
      </button>

    </div>

  </div>
  <script src="./script.js"></script>
</body>
</html>
